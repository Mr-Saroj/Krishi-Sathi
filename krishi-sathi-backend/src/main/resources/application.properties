spring.application.name=krishi-sathi-backend

# Database
spring.mongodb.host=${MONGO_HOST}
spring.mongodb.port=${MONGO_PORT}
spring.mongodb.database=${MONGO_DATABASE}

# Port
server.port=${SERVER_PORT}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
ml.api.url=http://localhost:8001

app.cookie.secure=false

#Clodnary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

#use  Thread pool concept

# Minimum idle worker threads
server.tomcat.threads.min-spare=10

# Maximum HTTP request-processing threads
server.tomcat.threads.max=100

# Maximum simultaneous connections
server.tomcat.max-connections=400

# OS-level pending connection backlog
server.tomcat.accept-count=200

#Razar pay integration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
